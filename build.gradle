plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "sapphire"
	}
}

dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

test {
	useJUnitPlatform()
	inputs.property('liveRankVerification', providers.environmentVariable('SAPPHIRE_RANK_LIVE').orElse('false'))
	inputs.property('liveHelpVerification', providers.environmentVariable('SAPPHIRE_HELP_LIVE').orElse('false'))
	inputs.property('liveChatTranslationVerification', providers.environmentVariable('SAPPHIRE_CHAT_LIVE').orElse('false'))
	def dictionaryArchive = providers.environmentVariable('SAPPHIRE_DICTIONARY_ZIP')
	inputs.property('dictionaryArchiveVerification', dictionaryArchive.isPresent())
	if (dictionaryArchive.isPresent()) {
		inputs.file(dictionaryArchive.get()).withPropertyName('dictionaryRelease').withPathSensitivity(PathSensitivity.NONE)
	}
	// Full item + GUI fixtures load the 8,937-entry dictionaries in several suites.
	maxHeapSize = '1g'
	// Dictionary suites retain full class-level snapshots. Recycle test workers
	// instead of retaining every suite's dictionaries in one ever-growing heap.
	forkEvery = 12
	// Wiki display auditing must be invalidated when staged dictionaries change.
	inputs.files(fileTree('translation-state/wiki-20261023/staged')).withPropertyName('wikiAuditFixtures')
	def bulkAudit = providers.environmentVariable('SAPPHIRE_BULK_AUDIT').orElse('false')
	inputs.property('bulkAuditEnabled', bulkAudit)
	if (bulkAudit.get() == 'true') {
		inputs.files(fileTree('translation-state/staged'), fileTree('translation-state/audit')).withPropertyName('bulkAuditFixtures')
		// The audit emits a repair queue used by installation, so always refresh it.
		outputs.upToDateWhen { false }
	}
	def weeklyAudit = providers.environmentVariable('SAPPHIRE_WEEKLY_AUDIT').orElse('false')
	inputs.property('weeklyAuditEnabled', weeklyAudit)
	if (weeklyAudit.get() == 'true') {
		inputs.files(fileTree('translation-state/weekly-20261021/audit')).withPropertyName('weeklyAuditFixtures')
		outputs.upToDateWhen { false }
	}
}

loom {
	runs {
		client {
			configName = 'Sapphire Client (direct launch)'
			if (project.hasProperty('sapphireSmoke') || project.hasProperty('sapphireApiSmoke') || project.hasProperty('sapphireDictionarySmoke')) {
				vmArg project.hasProperty('sapphireDictionarySmoke') ? '-Dsapphire.dictionarySmoke=true' : project.hasProperty('sapphireApiSmoke') ? '-Dsapphire.apiSmoke=true' : '-Dsapphire.smoke=true'
				if (project.hasProperty('sapphireDictionarySmoke')) {
					vmArg '-Dsapphire.dictionaryFixture=' + file(providers.gradleProperty('sapphireDictionaryFixture').orElse('exports/dictionaries/20261030_1.zip').get()).absolutePath
					vmArg '-Dsapphire.expectedDictionaryVersion=' + providers.gradleProperty('sapphireDictionaryVersion').orElse('20261030_1').get()
				}
				runDir = providers.gradleProperty('sapphireSmokeDir').orElse('build/sapphire-smoke-run').get()
			}
		}
		clientOffline {
			client()
			configName = 'Sapphire Offline'
			runDir = 'run'
		}
	}
}

// Loom 1.18 provides Microsoft device-code authentication and OS-protected
// credential storage. Keep Sapphire's account separate from other projects.
tasks.named('microsoftLogin') { profile = 'sapphire' }
tasks.named('microsoftLogout') { profile = 'sapphire' }
tasks.named('runClient') {
	profile = 'sapphire'
	microsoftAuthenticationEnabled = !(project.hasProperty('sapphireSmoke') || project.hasProperty('sapphireApiSmoke') || project.hasProperty('sapphireDictionarySmoke'))
	mustRunAfter tasks.named('microsoftLogin')
}
tasks.named('runClientOffline') {
	microsoftAuthenticationEnabled = false
	offline = true
}

// One compact content manifest avoids opening thousands of bundled ZIP entries on every launch.
def bundleHashDir = layout.buildDirectory.dir('generated/bundle-hashes')
def bundleSourceDir = layout.projectDirectory.dir('src/main/resources/defaults')
def bundleSourceFiles = fileTree(bundleSourceDir)
tasks.register('generateBundleHashes') {
	inputs.dir(bundleSourceDir)
	outputs.dir(bundleHashDir)
	doLast {
		def base = bundleSourceDir.asFile.toPath()
		def hashes = new TreeMap<String, String>()
		bundleSourceFiles.files.findAll { it.isFile() }.each { source ->
			def digest = java.security.MessageDigest.getInstance('SHA-256')
			source.withInputStream { stream ->
				byte[] buffer = new byte[65536]
				int count
				while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
			}
			hashes[base.relativize(source.toPath()).toString().replace('\\', '/')] = HexFormat.of().formatHex(digest.digest())
		}
		def target = bundleHashDir.get().file('defaults/bundle-hashes.json').asFile
		target.parentFile.mkdirs()
		target.setText(groovy.json.JsonOutput.toJson(hashes), 'UTF-8')
	}
}

processResources {
	dependsOn tasks.named('generateBundleHashes')
	from(bundleHashDir)
	def version = project.version
	inputs.property "version", version
	inputs.property "preserveJsonEscapes", true

	filesMatching("fabric.mod.json") {
		expand([version: version]) { escapeBackslash = true }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from("THIRD_PARTY_NOTICES.md")
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Dev helper: gradlew runClient -PcaptureSmoke=<properties file>
// launches the client, exercises the untranslated-chat capture once, verifies
// the upload removed the local file and stops the game.
tasks.matching { it.name == 'runClient' }.configureEach {
    if (project.hasProperty('captureSmoke')) {
        systemProperty 'sapphire.captureSmoke', 'true'
        systemProperty 'sapphire.captureSmokeConfig', project.property('captureSmoke').toString()
    }
}

// Dev helper: gradlew runClient -PconsentSmoke=accept|decline
// answers the first-launch consent dialog automatically for verification.
tasks.matching { it.name == 'runClient' }.configureEach {
    if (project.hasProperty('consentSmoke')) {
        systemProperty 'sapphire.consentSmoke', project.property('consentSmoke').toString()
    }
}
