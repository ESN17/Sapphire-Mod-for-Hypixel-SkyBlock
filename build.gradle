plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "sapphire"
	}
}

dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

test {
	useJUnitPlatform()
	// Full item + GUI fixtures load the 8,937-entry dictionaries in several suites.
	maxHeapSize = '1g'
	// Wiki display auditing must be invalidated when staged dictionaries change.
	inputs.files(fileTree('translation-state/wiki-20261023/staged')).withPropertyName('wikiAuditFixtures')
	def bulkAudit = providers.environmentVariable('SAPPHIRE_BULK_AUDIT').orElse('false')
	inputs.property('bulkAuditEnabled', bulkAudit)
	if (bulkAudit.get() == 'true') {
		inputs.files(fileTree('translation-state/staged'), fileTree('translation-state/audit')).withPropertyName('bulkAuditFixtures')
		// The audit emits a repair queue used by installation, so always refresh it.
		outputs.upToDateWhen { false }
	}
	def weeklyAudit = providers.environmentVariable('SAPPHIRE_WEEKLY_AUDIT').orElse('false')
	inputs.property('weeklyAuditEnabled', weeklyAudit)
	if (weeklyAudit.get() == 'true') {
		inputs.files(fileTree('translation-state/weekly-20261021/audit')).withPropertyName('weeklyAuditFixtures')
		outputs.upToDateWhen { false }
	}
}

loom {
	runs {
		client {
			configName = 'Sapphire Client (direct launch)'
			if (project.hasProperty('sapphireSmoke') || project.hasProperty('sapphireApiSmoke')) {
				vmArg project.hasProperty('sapphireApiSmoke') ? '-Dsapphire.apiSmoke=true' : '-Dsapphire.smoke=true'
				runDir = providers.gradleProperty('sapphireSmokeDir').orElse('build/sapphire-smoke-run').get()
			}
		}
		clientOffline {
			client()
			configName = 'Sapphire Offline'
			runDir = 'run'
		}
	}
}

// Loom 1.18 provides Microsoft device-code authentication and OS-protected
// credential storage. Keep Sapphire's account separate from other projects.
tasks.named('microsoftLogin') { profile = 'sapphire' }
tasks.named('microsoftLogout') { profile = 'sapphire' }
tasks.named('runClient') {
	profile = 'sapphire'
	microsoftAuthenticationEnabled = !(project.hasProperty('sapphireSmoke') || project.hasProperty('sapphireApiSmoke'))
	mustRunAfter tasks.named('microsoftLogin')
}
tasks.named('runClientOffline') {
	microsoftAuthenticationEnabled = false
	offline = true
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from("THIRD_PARTY_NOTICES.md")
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
